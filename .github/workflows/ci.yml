name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Hosted Ubuntu already supplies the Chromium runtime libraries.
      # Install the pinned browser without unrelated APT font downloads.
      - run: npx playwright install chromium
      - run: npm run test:e2e
